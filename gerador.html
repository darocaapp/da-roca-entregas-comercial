<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Da Roça - Gerador iFood e 99Food</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f3e7d3;
            color: #5b402d;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 520px;

            background: #ffffff;

            padding: 30px;

            border-radius: 20px;

            box-shadow:
                0 6px 25px rgba(0, 0, 0, 0.15);
        }

        h1 {
            text-align: center;

            margin-top: 0;
            margin-bottom: 5px;

            color: #65472f;
        }

        .subtitulo {
            text-align: center;

            margin-bottom: 30px;

            color: #80664f;
        }

        label {
            display: block;

            margin-top: 18px;
            margin-bottom: 7px;

            font-weight: bold;
        }

        input {
            width: 100%;

            padding: 15px;

            border: 2px solid #d8c5ae;
            border-radius: 10px;

            font-size: 18px;

            outline: none;
        }

        input:focus {
            border-color: #79583c;
        }

        .botoes-plataforma {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 25px;
        }

        button {
            border: none;

            padding: 16px;

            border-radius: 10px;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;
        }

        .ifood {
            background: #ea1d2c;
            color: white;
        }

        .food99 {
            background: #ffd400;
            color: #222222;
        }

        .resultado {
            display: none;

            margin-top: 25px;

            padding-top: 25px;

            border-top: 1px solid #e5d7c7;
        }

        .plataforma-escolhida {
            text-align: center;

            font-weight: bold;

            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 150px;

            padding: 14px;

            resize: none;

            border: 2px solid #d8c5ae;
            border-radius: 10px;

            font-size: 15px;
        }

        .acoes {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 12px;

            margin-top: 12px;
        }

        .copiar {
            background: #6b4f35;
            color: white;
        }

        .whatsapp {
            background: #25d366;
            color: white;
        }

        .status {
            min-height: 22px;

            text-align: center;

            margin-top: 15px;

            font-weight: bold;
        }

        @media (max-width: 480px) {

            .botoes-plataforma,
            .acoes {
                grid-template-columns: 1fr;
            }

            .container {
                padding: 22px;
            }
        }

    </style>
</head>

<body>

<div class="container">

    <h1>Da Roça Entregas</h1>

    <div class="subtitulo">
        Gerador de confirmação iFood e 99Food
    </div>


    <!-- NOME -->

    <label for="nome">
        Nome do cliente
    </label>

    <input
        id="nome"
        type="text"
        placeholder="Ex.: Rafaella"
        autocomplete="off"
    >


    <!-- LOCALIZADOR -->

    <label for="codigo">
        Localizador do pedido
    </label>

    <input
        id="codigo"
        type="text"
        inputmode="numeric"
        placeholder="Ex.: 1984 0113"
        autocomplete="off"
    >


    <!-- BOTÕES -->

    <div class="botoes-plataforma">

        <button
            class="ifood"
            onclick="gerar('ifood')"
        >
            GERAR iFOOD
        </button>


        <button
            class="food99"
            onclick="gerar('99')"
        >
            GERAR 99FOOD
        </button>

    </div>


    <!-- RESULTADO -->

    <div
        class="resultado"
        id="resultado"
    >

        <div
            class="plataforma-escolhida"
            id="plataformaEscolhida"
        >
        </div>


        <textarea
            id="mensagem"
            readonly
        ></textarea>


        <div class="acoes">

            <button
                class="copiar"
                onclick="copiarMensagem()"
            >
                COPIAR MENSAGEM
            </button>


            <button
                class="whatsapp"
                onclick="abrirWhatsApp()"
            >
                ABRIR WHATSAPP
            </button>

        </div>

    </div>


    <div
        class="status"
        id="status"
    >
    </div>

</div>


<script>

    let mensagemAtual = "";


    /*
    ==========================================
    REMOVE ESPAÇO DO LOCALIZADOR
    ==========================================

    Exemplo:

    1984 0113

    vira:

    19840113
    */

    document
        .getElementById("codigo")
        .addEventListener(
            "input",
            function () {

                this.value =
                    this.value
                        .replace(/\D/g, "")
                        .slice(0, 8);
            }
        );


    /*
    ==========================================
    GERAR
    ==========================================
    */

    function gerar(plataforma) {

        const nome =
            document
                .getElementById("nome")
                .value
                .trim();


        const codigo =
            document
                .getElementById("codigo")
                .value
                .replace(/\D/g, "")
                .slice(0, 8);


        const status =
            document.getElementById("status");


        status.textContent = "";


        /*
        NOME
        */

        if (!nome) {

            status.textContent =
                "Digite o nome do cliente.";

            document
                .getElementById("nome")
                .focus();

            return;
        }


        /*
        LOCALIZADOR
        */

        if (codigo.length !== 8) {

            status.textContent =
                "O localizador precisa ter 8 números.";

            document
                .getElementById("codigo")
                .focus();

            return;
        }


        let link = "";

        let nomePlataforma = "";


        /*
        ==========================================
        IFOOD
        ==========================================
        */

        if (plataforma === "ifood") {

            nomePlataforma =
                "iFood";


            /*
            Usa o projeto ORIGINAL do iFood,
            que já sabemos que funciona.
            */

            link =
                "https://darocaapp.github.io/" +
                "da-roca-entregas-apk/" +
                "?codigo=" +
                codigo;
        }


        /*
        ==========================================
        99FOOD
        ==========================================
        */

        if (plataforma === "99") {

            nomePlataforma =
                "99Food";


            /*
            Usa o novo projeto da 99,
            que acabamos de testar.
            */

            link =
                "https://darocaapp.github.io/" +
                "da-roca-entregas-99-teste/" +
                "?plataforma=99&codigo=" +
                codigo;
        }


        /*
        ==========================================
        MENSAGEM PARA O MOTOBOY
        ==========================================
        */

        mensagemAtual =
            "🛵 ENTREGA: " +
            nome.toUpperCase() +
            "\n\n" +

            "Confirmação " +
            nomePlataforma +
            ":\n" +

            link;


        /*
        MOSTRA MENSAGEM
        */

        document
            .getElementById("mensagem")
            .value =
                mensagemAtual;


        /*
        MOSTRA PLATAFORMA
        */

        document
            .getElementById(
                "plataformaEscolhida"
            )
            .textContent =
                "Plataforma: " +
                nomePlataforma;


        /*
        MOSTRA RESULTADO
        */

        document
            .getElementById("resultado")
            .style.display =
                "block";


        status.textContent =
            "Mensagem gerada!";
    }


    /*
    ==========================================
    COPIAR MENSAGEM
    ==========================================
    */

    async function copiarMensagem() {

        const status =
            document.getElementById("status");


        if (!mensagemAtual) {

            status.textContent =
                "Primeiro gere uma mensagem.";

            return;
        }


        try {

            await navigator
                .clipboard
                .writeText(
                    mensagemAtual
                );


            status.textContent =
                "Mensagem copiada!";


        } catch (erro) {


            /*
            MÉTODO ALTERNATIVO
            */

            const textarea =
                document.getElementById(
                    "mensagem"
                );


            textarea.select();


            document.execCommand(
                "copy"
            );


            status.textContent =
                "Mensagem copiada!";
        }
    }


    /*
    ==========================================
    ABRIR WHATSAPP
    ==========================================
    */

    function abrirWhatsApp() {

        const status =
            document.getElementById("status");


        if (!mensagemAtual) {

            status.textContent =
                "Primeiro gere uma mensagem.";

            return;
        }


        const url =
            "https://wa.me/?text=" +
            encodeURIComponent(
                mensagemAtual
            );


        window.open(
            url,
            "_blank"
        );
    }

</script>

</body>

</html>
