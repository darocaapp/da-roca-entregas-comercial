<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Da Roça Entregas</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background: #f3e7d3;
            color: #5b402d;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            padding: 20px;
        }

        .box {
            width: 100%;
            max-width: 420px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 5px 20px rgba(0,0,0,.15);
        }

        h1 {
            margin-top: 0;

            color: #6b4f35;
        }

        .plataforma {
            margin-top: 20px;

            font-size: 20px;
            font-weight: bold;
        }

        .codigo {
            margin: 20px 0;

            font-size: 32px;
            font-weight: bold;

            letter-spacing: 3px;
        }

        button {
            width: 100%;

            padding: 17px;

            border: none;
            border-radius: 12px;

            background: #6b4f35;
            color: white;

            font-size: 18px;
            font-weight: bold;

            cursor: pointer;
        }

        #aviso {
            margin-top: 18px;

            font-size: 14px;
        }

    </style>
</head>


<body>

<div class="box">

    <h1>Da Roça Entregas</h1>

    <div
        class="plataforma"
        id="plataforma"
    >
        Carregando...
    </div>


    <div
        class="codigo"
        id="codigo"
    >
        --------
    </div>


    <button onclick="abrirApp()">
        ABRIR CONFIRMAÇÃO
    </button>


    <div id="aviso">
        Preparando aplicativo...
    </div>

</div>


<script>

    /*
    =====================================
    LÊ OS DADOS DO LINK
    =====================================
    */

    const params =
        new URLSearchParams(
            window.location.search
        );


    let codigo =
        params.get("codigo") || "";


    let plataforma =
        params.get("plataforma") || "ifood";


    /*
    =====================================
    LIMPA O CÓDIGO
    =====================================
    */

    codigo =
        codigo.replace(/\D/g, "");


    plataforma =
        plataforma
            .toLowerCase()
            .trim();


    /*
    =====================================
    IDENTIFICA PLATAFORMA
    =====================================
    */

    if (
        plataforma === "99" ||
        plataforma === "99food" ||
        plataforma === "99-food"
    ) {

        plataforma = "99";

        document
            .getElementById("plataforma")
            .textContent =
                "99Food";

    } else {

        plataforma = "ifood";

        document
            .getElementById("plataforma")
            .textContent =
                "iFood";
    }


    /*
    =====================================
    MOSTRA O CÓDIGO
    =====================================
    */

    if (codigo.length === 8) {

        document
            .getElementById("codigo")
            .textContent =
                codigo;

    } else {

        document
            .getElementById("codigo")
            .textContent =
                "Código não informado";

        document
            .getElementById("aviso")
            .textContent =
                "Localizador inválido.";
    }


    /*
    =====================================
    ABRE O APLICATIVO
    =====================================
    */

    function abrirApp() {

        if (codigo.length !== 8) {

            document
                .getElementById("aviso")
                .textContent =
                    "Localizador inválido.";

            return;
        }


        let destino;


        if (plataforma === "99") {

            destino =
                "daroca://99/" +
                codigo;

        } else {

            destino =
                "daroca://ifood/" +
                codigo;
        }


        document
            .getElementById("aviso")
            .textContent =
                "Abrindo aplicativo...";


        window.location.href =
            destino;
    }


    /*
    =====================================
    ABRE AUTOMATICAMENTE
    =====================================
    */

    if (codigo.length === 8) {

        setTimeout(
            abrirApp,
            700
        );
    }

</script>

</body>

</html>
